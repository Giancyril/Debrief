<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0f1011"/>

  <!-- Document body -->
  <rect x="7" y="5" width="13" height="17" rx="1.5" fill="#1e2124" stroke="#3a3d42" stroke-width="1"/>

  <!-- Folded corner dog-ear -->
  <path d="M16 5 L20 9 L16 9 Z" fill="#0f1011" stroke="#3a3d42" stroke-width="0.8"/>
  <path d="M16 5 L20 9" stroke="#3a3d42" stroke-width="0.8"/>

  <!-- Lines on document -->
  <line x1="9.5" y1="13" x2="17.5" y2="13" stroke="#4a9eff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9.5" y1="16" x2="15.5" y2="16" stroke="#4a9eff" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="9.5" y1="19" x2="13.5" y2="19" stroke="#4a9eff" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- Audio waveform bars (bottom right accent) -->
  <rect x="19" y="20" width="2.2" height="7" rx="1.1" fill="#4a9eff" opacity="0.9"/>
  <rect x="22" y="18" width="2.2" height="9" rx="1.1" fill="#4a9eff" opacity="0.7"/>
  <rect x="25" y="21.5" width="2.2" height="5.5" rx="1.1" fill="#4a9eff" opacity="0.5"/>
</svg>